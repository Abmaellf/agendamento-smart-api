name: agendamento-smart

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: agendamento-smart-api:${APP_VERSION:-local}
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      AGENDA_URL: jdbc:postgresql://db:5432/${AGENDA_DB_NAME:-agendamento-smart-api}
      AGENDA_DB_USER: ${AGENDA_DB_USER:-agenda}
      AGENDA_DB_PASSWORD: ${AGENDA_DB_PASSWORD:-agenda-local-password}
      AGENDA_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/seed/dev
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
    ports:
      - "${AGENDA_API_BIND_ADDRESS:-0.0.0.0}:${AGENDA_API_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: bitnami/postgresql:latest
    restart: unless-stopped
    environment:
      POSTGRESQL_USERNAME: ${AGENDA_DB_USER:-agenda}
      POSTGRESQL_PASSWORD: ${AGENDA_DB_PASSWORD:-agenda-local-password}
      POSTGRESQL_DATABASE: ${AGENDA_DB_NAME:-agendamento-smart-api}
      POSTGRESQL_TIMEZONE: UTC
    ports:
      - "${AGENDA_DB_BIND_ADDRESS:-127.0.0.1}:${AGENDA_DB_PORT:-5432}:5432"
    volumes:
      - postgresql_data:/bitnami/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --host=127.0.0.1 --port=5432 --username="$${POSTGRESQL_USERNAME}" --dbname="$${POSTGRESQL_DATABASE}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    driver: bridge

volumes:
  postgresql_data:
