spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false

  flyway:
    locations: ${AGENDA_FLYWAY_LOCATIONS:classpath:db/migration}

api:
  security:
    cookie:
      secure: ${JWT_COOKIE_SECURE:true}

logging:
  level:
    root: WARN
    com.agendamento.smart: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework.jdbc.core: WARN
