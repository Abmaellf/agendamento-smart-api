server:
  port: 8080


spring:

  # ============================================================
  # DATABASE
  # ============================================================
  datasource:
    url: ${AGENDA_URL}
    username: ${AGENDA_DB_USER}
    password: ${AGENDA_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver


  # ============================================================
  # JPA / HIBERNATE
  # ============================================================
  jpa:
    show-sql: false

    hibernate:
      ddl-auto: validate

      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          lob:
            non_contextual_creation: true


  # ============================================================
  # FLYWAY
  # ============================================================
  flyway:
    enabled: true
    locations: ${AGENDA_FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: false
    out-of-order: false

  # defer-datasource-initialization: true


# ============================================================
# SECURITY
# ============================================================
api:
  security:
    token:
      secret: ${JWT_SECRET}


# ============================================================
# PROJECT
# ============================================================
project:
  version: "@project.version@"


# ============================================================
# LOGGING
# ============================================================
logging:
  level:
    root: INFO
    com.agendamento.smart: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework.jdbc.core: WARN
