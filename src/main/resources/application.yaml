server:
  port: 8080


spring:

  # ============================================================
  # DATABASE
  # ============================================================
  datasource:
    url: ${AGENDA_URL}
    username: ${AGENDA_DB_USER}
    password: ${AGENDA_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver


  # ============================================================
  # JPA / HIBERNATE
  # ============================================================
  jpa:
    show-sql: false

    hibernate:
      ddl-auto: validate

      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          lob:
            non_contextual_creation: true


  # ============================================================
  # FLYWAY
  # ============================================================
  flyway:
    enabled: true
    locations: ${AGENDA_FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: false
    out-of-order: false

  # defer-datasource-initialization: true


# ============================================================
# SECURITY
# ============================================================
api:
  security:
    cookie:
      secure: ${JWT_COOKIE_SECURE:false}
      same-site: ${JWT_COOKIE_SAME_SITE:Lax}
      access-name: ${JWT_ACCESS_COOKIE_NAME:jwt}
      refresh-name: ${JWT_REFRESH_COOKIE_NAME:refresh_token}
    token:
      secret: ${JWT_SECRET}
      access-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-ttl: ${JWT_REFRESH_TTL:30d}


# ============================================================
# PROJECT
# ============================================================
project:
  version: "@project.version@"

appointments:
  status-monitor:
    enabled: ${APPOINTMENTS_STATUS_MONITOR_ENABLED:true}
    fixed-delay-ms: ${APPOINTMENTS_STATUS_MONITOR_FIXED_DELAY_MS:60000}
    initial-delay-ms: ${APPOINTMENTS_STATUS_MONITOR_INITIAL_DELAY_MS:10000}


# ============================================================
# LOGGING
# ============================================================
logging:
  level:
    root: INFO
    com.agendamento.smart: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework.jdbc.core: WARN
