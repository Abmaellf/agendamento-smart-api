spring:
  config:
    activate:
      on-profile: homo

  jpa:
    show-sql: false

  flyway:
    locations: ${AGENDA_FLYWAY_LOCATIONS:classpath:db/migration}

logging:
  level:
    root: INFO
    com.agendamento.smart: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework.jdbc.core: WARN
